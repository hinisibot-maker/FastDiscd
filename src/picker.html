<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
    <title>配信する画面を選択</title>
    <style>
        :root { color-scheme: dark; }
        body {
            margin: 0; padding: 14px 16px; background: #1e1f22; color: #dbdee1;
            font-family: "Yu Gothic UI", "Segoe UI", sans-serif; font-size: 13.5px; user-select: none;
        }
        .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
        .tab {
            background: #2b2d31; border: 1px solid #3f4147; color: #dbdee1;
            padding: 7px 14px; border-radius: 8px; cursor: pointer; font-size: 13px;
            isolation: isolate; box-shadow: none;
        }
        .tab.active { background: #5865f2; border-color: #5865f2; color: #fff; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; background: #1e1f22; }
        .card {
            background: #2b2d31; border: 1px solid #3f4147; border-radius: 10px;
            overflow: hidden; cursor: pointer; text-align: left; color: #dbdee1; padding: 0;
        }
        .card:hover { border-color: #5865f2; }
        .card img { display: block; width: 100%; height: 158px; object-fit: contain; background: #111214; }
        .card .label { padding: 8px 10px; }
        .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .meta { color: #949ba4; font-size: 11.5px; margin-top: 2px; }
        .empty { color: #949ba4; padding: 20px 0; }
        .footer { display: flex; justify-content: flex-end; margin-top: 14px; }
        button.cancel { background: #4e5058; color: #fff; border: none; border-radius: 8px; padding: 8px 16px; cursor: pointer; }
    </style>
</head>

<body>
    <div class="tabs">
        <button class="tab active" data-kind="screen">画面全体</button>
        <button class="tab" data-kind="window">ウインドウ</button>
    </div>
    <div class="grid" id="grid"><div class="empty">読み込み中...</div></div>
    <div class="footer"><button class="cancel" id="cancel">キャンセル</button></div>

    <script>
        const tauriApi = window.__TAURI__ || {};
        const invoke = (tauriApi.core && tauriApi.core.invoke) || (window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.invoke);
        let sources = [];
        let kind = "screen";

        function render() {
            const grid = document.getElementById("grid");
            const items = sources.filter(s => s.kind === kind);
            if (items.length === 0) {
                grid.innerHTML = '<div class="empty">該当する画面がありません</div>';
                return;
            }
            grid.innerHTML = "";
            for (const s of items) {
                const card = document.createElement("button");
                card.className = "card";
                const img = document.createElement("img");
                if (s.thumb) img.src = "data:image/jpeg;base64," + s.thumb;
                const label = document.createElement("div");
                label.className = "label";
                const name = document.createElement("div");
                name.className = "name";
                name.textContent = s.name;
                const meta = document.createElement("div");
                meta.className = "meta";
                meta.textContent = s.width + " × " + s.height;
                label.appendChild(name); label.appendChild(meta);
                card.appendChild(img); card.appendChild(label);
                card.addEventListener("click", () => {
                    invoke("select_source", { id: s.id, kind: s.kind, x: s.x, y: s.y, width: s.width, height: s.height });
                });
                grid.appendChild(card);
            }
        }

        document.querySelectorAll(".tab").forEach(btn => {
            btn.addEventListener("click", () => {
                document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                kind = btn.getAttribute("data-kind");
                render();
            });
        });

        document.getElementById("cancel").addEventListener("click", () => invoke("close_picker"));

        function load() {
            invoke("list_sources").then(list => { sources = list || []; render(); }).catch((e) => {
                document.getElementById("grid").textContent = "読み込みに失敗: " + e;
            });
        }
        window.addEventListener("focus", load);
        setInterval(function () {
            if (document.visibilityState === "visible") load();
        }, 1000);
        load();
    </script>
</body>

</html>
