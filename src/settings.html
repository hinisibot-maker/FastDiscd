<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FastDiscd Settings</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #1e1f22;
            --card: #2b2d31;
            --text: #dbdee1;
            --muted: #949ba4;
            --accent: #5865f2;
            --line: #3f4147;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 22px 24px 18px;
            background: var(--bg);
            color: var(--text);
            font-family: "Yu Gothic UI", "Segoe UI", sans-serif;
            font-size: 14px;
            user-select: none;
        }

        h1 { font-size: 18px; margin: 0 0 4px; }

        .sub { color: var(--muted); font-size: 12px; margin-bottom: 16px; }

        .group { background: var(--card); border-radius: 10px; padding: 6px 14px; margin-bottom: 12px; }

        .row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 0;
            border-bottom: 1px solid var(--line);
        }

        .row:last-child { border-bottom: none; }
        .row .label { flex: 1; }
        .row .hint { color: var(--muted); font-size: 11.5px; margin-top: 2px; }

        input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
        input[type="range"] { flex: 0 0 150px; accent-color: var(--accent); }
        select {
            background: #1e1f22; color: var(--text); border: 1px solid var(--line);
            border-radius: 6px; padding: 6px 8px; font-size: 13px;
        }

        .value { width: 46px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }

        .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }

        button {
            background: var(--accent); color: #fff; border: none; border-radius: 8px;
            padding: 9px 16px; font-size: 13.5px; cursor: pointer;
        }

        button.secondary { background: #4e5058; }
        button:hover { filter: brightness(1.1); }

        .status { color: var(--muted); font-size: 12px; margin-top: 10px; min-height: 16px; }
    </style>
</head>

<body>
    <h1 data-i18n="title">FastDiscd Settings</h1>
    <div class="sub" data-i18n="subtitle"></div>

    <div class="group">
        <div class="row">
            <div class="label">
                <span data-i18n="language.label"></span>
                <div class="hint" data-i18n="language.hint"></div>
            </div>
            <select id="language">
                <option value="auto" data-i18n="language.auto"></option>
                <option value="ja">日本語</option>
                <option value="en">English</option>
            </select>
        </div>
    </div>

    <div class="group">

        <div class="row">
            <div class="label">
                <span data-i18n="share.label"></span>
                <div class="hint" data-i18n="share.hint"></div>
            </div>
            <input type="checkbox" id="screenShare" />
        </div>
    </div>
    <div class="group">
        <div class="row">
            <div class="label">
                <span data-i18n="cacheNav.label"></span>
                <div class="hint" data-i18n="cacheNav.hint"></div>
            </div>
            <input type="checkbox" id="clearCacheOnNavigation" />
        </div>
        <div class="row">
            <div class="label">
                <span data-i18n="cacheChannel.label"></span>
                <div class="hint" data-i18n="cacheChannel.hint"></div>
            </div>
            <input type="checkbox" id="clearCacheOnChannelChange" />
        </div>
    </div>

    <div class="group">
        <div class="row">
            <div class="label">
                <span data-i18n="mem.focused"></span>
                <div class="hint" data-i18n="mem.hint"></div>
            </div>
            <select id="memFocused">
                <option value="normal">Normal</option>
                <option value="low">Low</option>
            </select>
        </div>
        <div class="row">
            <div class="label"><span data-i18n="mem.unfocused"></span></div>
            <select id="memUnfocused">
                <option value="normal">Normal</option>
                <option value="low">Low</option>
            </select>
        </div>
        <div class="row">
            <div class="label"><span data-i18n="mem.minimized"></span></div>
            <select id="memMinimized">
                <option value="normal">Normal</option>
                <option value="low">Low</option>
            </select>
        </div>
    </div>

    <div class="group">
        <div class="row">
            <div class="label">
                <span data-i18n="ptt.label"></span>
                <div class="hint" data-i18n="ptt.hint"></div>
            </div>
            <button class="secondary" id="pttButton">—</button>
            <button class="secondary" id="pttClear" title="Clear">×</button>
        </div>
    </div>

    <div class="group">
        <div class="row">
            <div class="label">
                <span data-i18n="autostart.label"></span>
                <div class="hint" data-i18n="autostart.hint"></div>
            </div>
            <input type="checkbox" id="startWithWindows" />
        </div>
        <div class="row">
            <div class="label">
                <span data-i18n="startMin.label"></span>
                <div class="hint" data-i18n="startMin.hint"></div>
            </div>
            <input type="checkbox" id="startMinimized" />
        </div>
        <div class="row">
            <div class="label">
                <span data-i18n="tray.label"></span>
                <div class="hint" data-i18n="tray.hint"></div>
            </div>
            <input type="checkbox" id="minimizeToTray" />
        </div>
        <div class="row">
            <div class="label">
                <span data-i18n="gpu.label"></span>
                <div class="hint" data-i18n="gpu.hint"></div>
            </div>
            <input type="checkbox" id="hardwareAcceleration" />
        </div>
    </div>

    <div class="group">
        <div class="row">
            <div class="label">
                <span data-i18n="zoom.label"></span>
                <div class="hint" data-i18n="zoom.hint"></div>
            </div>
            <input type="range" id="zoom" min="0.5" max="2" step="0.1" />
            <span class="value" id="zoomValue">100%</span>
        </div>
    </div>

    <div class="actions">
        <button class="secondary" id="clearNow" data-i18n="clearNow"></button>
        <button id="close" data-i18n="close"></button>
    </div>
    <div class="status" id="status"></div>

    <script>
        const { invoke } = window.__TAURI__.core;

        const I18N = {
            en: {
                "title": "FastDiscd Settings",
                "subtitle": "Changes are applied immediately and saved automatically.",
                "language.label": "Language",
                "language.hint": "Auto follows Discord's language (falls back to English).",
                "language.auto": "Auto (match Discord)",
                "cacheNav.label": "Clear cache on page load",
                "cacheNav.hint": "Drops the HTTP cache whenever a page loads.",
                "cacheChannel.label": "Clear previous page cache on channel switch",
                "cacheChannel.hint": "Discards the old channel's images/GIF cache when switching channels.",
                "minimizeMem.label": "Free memory when minimized",
                "minimizeMem.hint": "Puts WebView2 into a low-memory state while minimized (notifications keep working).",
                "lowMem.label": "Low memory target when unfocused",
                "lowMem.hint": "Asks WebView2 to run in low-memory mode while another window is active.",
                "ptt.label": "Push-to-talk (global)",
                "ptt.hint": "Set the same key as Discord. Works even when another window is focused.",
                "autostart.label": "Launch at Windows startup",
                "autostart.hint": "Adds an HKCU Run entry (no admin required).",
                "startMin.label": "Start minimized",
                "startMin.hint": "Takes effect on the next launch.",
                "tray.label": "Minimize to tray",
                "tray.hint": "Left-click the tray icon to restore.",
                "gpu.label": "Hardware acceleration (GPU)",
                "gpu.hint": "Disabling takes effect after a restart.",
                "zoom.label": "Zoom",
                "zoom.hint": "Substitute for Discord's zoom setting, which the web app does not expose.",
                "clearNow": "Clear cache now",
                "close": "Close",
                "status.saved": "Saved",
                "status.saveError": "Failed to save: ",
                "status.loadError": "Failed to load settings: ",
                "status.cacheCleared": "Cache cleared",
                "status.gpuRestart": "GPU setting applies after a restart",
                "status.pttSet": "PTT key set to ",
                "status.capture": "Press a key... (Esc to cancel)",
                "ptt.none": "Not set",
                "share.label": "Screen sharing (experimental)",
                "share.hint": "Uses a custom capture pipeline. May be unstable, especially in app mode.",
                "mem.focused": "Memory target: focused",
                "mem.unfocused": "Memory target: unfocused",
                "mem.minimized": "Memory target: minimized",
                "mem.hint": "Low reduces memory usage but may be slower when returning."
            },
            ja: {
                "title": "FastDiscd 設定",
                "subtitle": "設定は即時反映され、自動的に保存されます。",
                "language.label": "言語",
                "language.hint": "「Discordに合わせる」はDiscordの言語に追従します（非対応言語は英語）。",
                "language.auto": "Discordに合わせる",
                "cacheNav.label": "ページ読み込み時にキャッシュを削除",
                "cacheNav.hint": "ページ遷移時に HTTP キャッシュを破棄します。",
                "cacheChannel.label": "チャンネル切替時に前ページのキャッシュを削除",
                "cacheChannel.hint": "チャンネル切替時に旧ページの画像・GIFキャッシュを破棄します。",
                "minimizeMem.label": "最小化時にメモリを解放",
                "minimizeMem.hint": "最小化中は WebView2 を省メモリ状態にします（通知は止まりません）。",
                "lowMem.label": "非フォーカス時にメモリ目標を Low にする",
                "lowMem.hint": "他のウィンドウを操作している間、WebView2 に省メモリ動作を指示します。",
                "ptt.label": "プッシュトゥトーク（グローバル）",
                "ptt.hint": "Discord の PTT キーと同じキーを設定してください。別ウィンドウでも反応します。",
                "autostart.label": "Windows 起動時に自動で開く",
                "autostart.hint": "HKCU の Run に登録します（管理者権限不要）。",
                "startMin.label": "起動時は最小化して開始",
                "startMin.hint": "次回起動から反映されます。",
                "tray.label": "最小化時にタスクトレイへ格納",
                "tray.hint": "トレイアイコンの左クリックで戻ります。",
                "gpu.label": "ハードウェアアクセラレーション（GPU）",
                "gpu.hint": "オフは再起動後に反映されます。",
                "zoom.label": "拡大率",
                "zoom.hint": "Discord Web に拡大率設定が無いための代替です。",
                "clearNow": "キャッシュを今すぐ削除",
                "close": "閉じる",
                "status.saved": "保存しました",
                "status.saveError": "保存に失敗: ",
                "status.loadError": "設定の読み込みに失敗: ",
                "status.cacheCleared": "キャッシュを削除しました",
                "status.gpuRestart": "GPU 設定は再起動後に反映されます",
                "status.pttSet": "PTT キーを設定しました: ",
                "status.capture": "キーを押してください…（Escで解除）",
                "ptt.none": "未設定",
                "share.label": "画面共有（実験的）",
                "share.hint": "独自キャプチャで配信します。不安定な場合があります（特にアプリモード）。",
                "mem.focused": "メモリ目標: フォーカス時",
                "mem.unfocused": "メモリ目標: 非フォーカス時",
                "mem.minimized": "メモリ目標: 最小化時",
                "mem.hint": "Low はメモリを抑えますが、復帰時に重くなることがあります。"
            }
        };

        const fields = ["clearCacheOnNavigation", "clearCacheOnChannelChange", "startMinimized", "minimizeToTray", "hardwareAcceleration"];
        const $ = id => document.getElementById(id);

        let settings = null;
        let lang = "en";
        let ready = false;
        let pttCode = "";
        let capturing = false;

        const t = key => (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key;

        function applyLanguage() {
            for (const el of document.querySelectorAll("[data-i18n]")) {
                el.textContent = t(el.getAttribute("data-i18n"));
            }
            $("pttButton").textContent = pttCode ? pttCode.replace("Key", "") : t("ptt.none");
            document.title = t("title");
        }

        function updateZoomLabel() {
            $("zoomValue").textContent = Math.round(Number($("zoom").value) * 100) + "%";
        }

        async function resolveLanguage(preferred) {
            if (preferred === "ja" || preferred === "en") return preferred;
            try {
                const discord = await invoke("get_discord_locale");
                if (discord && discord.startsWith("ja")) return "ja";
                if (discord) return "en";
            } catch (e) { }
            return (navigator.language || "en").startsWith("ja") ? "ja" : "en";
        }

        function render(s) {
            settings = s;
            for (const key of fields) $(key).checked = !!s[key];
            $("zoom").value = s.zoom;
            $("language").value = s.language || "auto";
            $("screenShare").checked = !!s.screenShare;
            $("memFocused").value = s.memFocused || "normal";
            $("memUnfocused").value = s.memUnfocused || "low";
            $("memMinimized").value = s.memMinimized || "low";
            pttCode = s.pushToTalkCode || "";
            updateZoomLabel();
            applyLanguage();
        }

        function collect() {
            return {
                clearCacheOnNavigation: $("clearCacheOnNavigation").checked,
                clearCacheOnChannelChange: $("clearCacheOnChannelChange").checked,
                suspendOnMinimize: $("suspendOnMinimize").checked,
                lowMemoryOnBlur: $("lowMemoryOnBlur").checked,
                startMinimized: $("startMinimized").checked,
                minimizeToTray: $("minimizeToTray").checked,
                hardwareAcceleration: $("hardwareAcceleration").checked,
                zoom: Number($("zoom").value),
                pushToTalkCode: pttCode,
                language: $("language").value,
                screenShare: $("screenShare").checked,
                memFocused: $("memFocused").value,
                memUnfocused: $("memUnfocused").value,
                memMinimized: $("memMinimized").value
            };
        }

        let saveTimer = null;
        async function save() {
            if (!ready) return;
            clearTimeout(saveTimer);
            saveTimer = setTimeout(async () => {
                const payload = collect();
                try {
                    await invoke("save_settings", { settings: payload });
                    $("status").textContent = t("status.saved");
                    setTimeout(() => ($("status").textContent = ""), 1500);
                } catch (e) {
                    $("status").textContent = t("status.saveError") + e;
                }
            }, 150);
        }

        for (const key of fields) $(key).addEventListener("change", save);
        $("zoom").addEventListener("input", () => { updateZoomLabel(); save(); });

        $("language").addEventListener("change", async () => {
            lang = await resolveLanguage($("language").value);
            applyLanguage();
            save();
        });

        $("memFocused").addEventListener("change", save);
        $("memUnfocused").addEventListener("change", save);
        $("memMinimized").addEventListener("change", save);
        $("screenShare").addEventListener("change", save);

        $("clearNow").addEventListener("click", async () => {
            await invoke("clear_cache_now");
            $("status").textContent = t("status.cacheCleared");
            setTimeout(() => ($("status").textContent = ""), 1500);
        });

        $("close").addEventListener("click", () => invoke("close_settings"));

        $("pttClear").addEventListener("click", () => {
            pttCode = "";
            $("pttButton").textContent = t("ptt.none");
            save();
        });

        $("pttButton").addEventListener("click", () => {
            capturing = true;
            $("pttButton").textContent = t("status.capture");
        });

        window.addEventListener("keydown", e => {
            if (!capturing) return;
            e.preventDefault();
            e.stopPropagation();
            capturing = false;
            if (e.code === "Escape") {
                $("pttButton").textContent = pttCode ? pttCode.replace("Key", "") : t("ptt.none");
                return;
            }
            pttCode = e.code;
            $("pttButton").textContent = pttCode.replace("Key", "");
            save();
        }, true);

        $("hardwareAcceleration").addEventListener("change", () => {
            $("status").textContent = t("status.gpuRestart");
        });

        invoke("get_autostart").then(v => { $("startWithWindows").checked = !!v; }).catch(() => { });
        $("startWithWindows").addEventListener("change", async () => {
            await invoke("set_autostart", { enabled: $("startWithWindows").checked });
        });

        invoke("get_settings").then(async s => {
            render(s);
            lang = await resolveLanguage(s.language || "auto");
            applyLanguage();
            ready = true;
        }).catch(e => {
            $("status").textContent = t("status.loadError") + e;
        });
    </script>
</body>

</html>
