<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
    <title>カスタムメモリ設定</title>
    <style>
        :root { color-scheme: dark; }
        body {
            margin: 0; padding: 20px 22px; background: #1e1f22; color: #dbdee1;
            font-family: "Yu Gothic UI", "Segoe UI", sans-serif; font-size: 14px; user-select: none;
        }
        h1 { font-size: 17px; margin: 0 0 14px; }
        .row { display: flex; align-items: center; gap: 10px; padding: 9px 0; }
        .row label { flex: 1; }
        .hint { color: #949ba4; font-size: 11.5px; margin-top: 2px; }
        input[type="text"], input[type="number"], select {
            background: #1e1f22; color: #dbdee1; border: 1px solid #3f4147;
            border-radius: 6px; padding: 6px 8px; font-size: 13px; width: 170px;
        }
        input[type="checkbox"] { width: 18px; height: 18px; accent-color: #5865f2; }
        .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
        button {
            background: #5865f2; color: #fff; border: none; border-radius: 8px;
            padding: 9px 16px; font-size: 13.5px; cursor: pointer;
        }
        button.secondary { background: #4e5058; }
        .status { color: #949ba4; font-size: 12px; margin-top: 10px; min-height: 16px; }
    </style>
</head>

<body>
    <h1>カスタムメモリ設定</h1>

    <div class="row">
        <label>プリセット名<div class="hint">状態の選択肢に表示される名前</div></label>
        <input type="text" id="name" maxlength="24" />
    </div>

    <div class="row">
        <label>メモリ目標<div class="hint">WebView2が対応するのは Normal / Low の2段階です</div></label>
        <select id="level">
            <option value="normal">Normal</option>
            <option value="low">Low</option>
        </select>
    </div>

    <div class="row">
        <label>ワーキングセットを強制解放<div class="hint">指定時間後に物理メモリをOSへ返します（復帰が少し遅くなります）</div></label>
        <input type="checkbox" id="trim" />
    </div>

    <div class="row">
        <label>解放までの待ち時間（秒）</label>
        <input type="number" id="delay" min="5" max="3600" step="5" />
    </div>

    <div class="actions">
        <button class="secondary" id="cancel">閉じる</button>
        <button id="save">保存</button>
    </div>
    <div class="status" id="status"></div>

    <script>
        const { invoke } = window.__TAURI__.core;
        const $ = id => document.getElementById(id);
        let settings = null;

        function render(s) {
            settings = s;
            $("name").value = s.customMemoryName || "Custom";
            $("level").value = s.customMemoryLevel || "low";
            $("trim").checked = !!s.customMemoryTrim;
            $("delay").value = s.customMemoryTrimDelay || 60;
        }

        async function save() {
            if (!settings) return;
            settings.customMemoryName = ($("name").value || "Custom").slice(0, 24);
            settings.customMemoryLevel = $("level").value;
            settings.customMemoryTrim = $("trim").checked;
            settings.customMemoryTrimDelay = Math.max(5, Number($("delay").value) || 60);
            try {
                await invoke("save_settings", { settings });
                $("status").textContent = "保存しました";
                setTimeout(() => ($("status").textContent = ""), 1200);
            } catch (e) {
                $("status").textContent = "保存に失敗: " + e;
            }
        }

        $("save").addEventListener("click", save);
        $("cancel").addEventListener("click", () => invoke("close_custom"));
        invoke("get_settings").then(render).catch(e => { $("status").textContent = "読み込み失敗: " + e; });
    </script>
</body>

</html>
